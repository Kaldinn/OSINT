[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customosint"
version = "0.1.0"
description = "Evidence-first, auditable OSINT correlation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "PyYAML>=6.0", "Pillow>=10.0", "ImageHash>=4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
customosint = "customosint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/customosint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["customosint"]
